<!DOCTYPE html>
<html lang="zh-CN" class="dark dark-theme" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/kineo_brand_logo.jpg" />
    <link rel="apple-touch-icon" href="/kineo_brand_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050810" />
    <meta
      name="description"
      content="Kineo (Kineo AI) - 基于 Tauri 2.1 桌面端，集成多模型 AI 实现从小说/剧本到成片的端到端自动化。"
    />
    <meta
      name="keywords"
      content="kineo, AI漫剧, 漫剧创作, Tauri, 桌面应用, 多模型AI, 分镜设计, 角色一致性, TTS, FFmpeg"
    />
    <meta name="author" content="Agions" />

    <!-- 性能优化：关键资源预加载 -->
    <link rel="preload" href="/src/main.tsx" as="script" />

    <title>Kineo (Kineo AI)</title>

    <!-- 原生开屏 Splash 样式（防止 JS 加载期间出现长白屏） -->
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050810;
        color: #e0f5f8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .app-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: radial-gradient(ellipse at 50% 30%, rgba(0, 245, 212, 0.12) 0%, rgba(5, 8, 16, 0.98) 70%);
      }
      .app-splash-logo-wrap {
        position: relative;
        margin-bottom: 1.5rem;
      }
      .app-splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        border: 1.5px solid rgba(0, 245, 212, 0.5);
        box-shadow: 0 0 24px rgba(0, 245, 212, 0.3), 0 0 50px rgba(0, 245, 212, 0.15);
      }
      .app-splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0, 245, 212, 0.15);
        border-top-color: #00f5d4;
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      .app-splash-text {
        font-size: 14px;
        font-weight: 600;
        color: #00f5d4;
        letter-spacing: 0.05em;
        text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
      }
      .app-splash-sub {
        font-size: 11px;
        color: rgba(148, 180, 194, 0.6);
        margin-top: 6px;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 动态首屏 Splash Loader：React 挂载前立即呈现高质感开屏，解决白屏尴尬 -->
      <div class="app-splash-container">
        <div class="app-splash-logo-wrap">
          <img src="/kineo_brand_logo.jpg" alt="Kineo Logo" class="app-splash-logo" />
        </div>
        <div class="app-splash-spinner"></div>
        <div class="app-splash-text">Kineo Kineo AI · 启动中...</div>
        <div class="app-splash-sub">Tauri v2 + Rust 引擎与 React 组件初始化</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
