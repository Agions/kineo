<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-label="Kineo stacked logo">
  <title>Kineo</title>
  <defs>
    <linearGradient id="kineoSLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="kineoSText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="kineoSBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151B38"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
  </defs>

  <!-- 居中标志 -->
  <g transform="translate(80 28)">
    <rect width="200" height="200" rx="48" fill="url(#kineoSBg)" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(10 10) scale(0.70)">
      <path d="M 82 56 L 104 56 L 104 200 L 82 200 Z" fill="url(#kineoSLogo)"/>
      <path d="M 98 136 L 164 62 L 188 62 L 120 136 Z" fill="url(#kineoSLogo)"/>
      <path d="M 108 124 L 178 200 L 154 200 L 94 136 Z" fill="url(#kineoSLogo)"/>
      <circle cx="128" cy="128" r="14" fill="#00F5D4"/>
      <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 居中文字 -->
  <g text-anchor="middle">
    <text x="180" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#kineoSText)">
      KINEO
    </text>
    <text x="180" y="334" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" letter-spacing="2" fill="#E2E8F0">
      AI 漫剧创作平台
