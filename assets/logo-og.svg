<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Kineo social card">
  <title>Kineo · AI 漫剧创作平台</title>
  <defs>
    <radialGradient id="ogBgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#141938"/>
      <stop offset="60%" stop-color="#080B18"/>
      <stop offset="100%" stop-color="#03050A"/>
    </radialGradient>
    <linearGradient id="ogText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="ogLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ogBgGrad)"/>

  <!-- 背景科技光斑 -->
  <circle cx="1000" cy="280" r="260" fill="#7C3AED" opacity="0.15" filter="blur(40px)"/>
  <circle cx="300" cy="200" r="200" fill="#00F5D4" opacity="0.10" filter="blur(40px)"/>

  <!-- 左侧文字信息 -->
  <g transform="translate(80 0)">
    <text y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#00F5D4">
      v0.0.1 · OPEN SOURCE · MIT LICENSE
    </text>

    <!-- 主标题 KINEO -->
    <text y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="120" font-weight="900" letter-spacing="-3" fill="url(#ogText)">
      KINEO
    </text>

    <!-- 中文副标 -->
    <text y="348" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#F1F5F9">
      端到端 Multi-Agent 漫剧创作平台
    </text>
    <!-- 英文副标 -->
    <text y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#94A3B8">
      Novel-to-4K Video AI Pipeline · Tauri v2 + React 19 + Rust
    </text>

    <!-- 特性徽章 -->
    <g transform="translate(0 440)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">
      <g>
        <rect width="145" height="36" rx="18" fill="#00F5D4" fill-opacity="0.15" stroke="#00F5D4" stroke-opacity="0.6"/>
        <text x="72" y="23" fill="#5EEAD4" text-anchor="middle">TAURI 2 · RUST</text>
      </g>
      <g transform="translate(160 0)">
        <rect width="170" height="36" rx="18" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-opacity="0.6"/>
        <text x="85" y="23" fill="#C4B5FD" text-anchor="middle">MULTI-AGENT SWARM</text>
      </g>
      <g transform="translate(345 0)">
        <rect width="170" height="36" rx="18" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-opacity="0.6"/>
        <text x="85" y="23" fill="#F472B6" text-anchor="middle">CONSISTENCY LOCK</text>
      </g>
      <g transform="translate(530 0)">
        <rect width="160" height="36" rx="18" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-opacity="0.6"/>
        <text x="80" y="23" fill="#A5B4FC" text-anchor="middle">4K GPU ENCODE</text>
      </g>
    </g>
  </g>

  <!-- 右侧大画幅超级符号 -->
  <g transform="translate(840 140)">
    <rect width="360" height="360" rx="84" fill="#080D20" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.5"/>
    <g transform="translate(20 20) scale(1.25)">
      <path d="M 82 56 L 104 56 L 104 200 L 82 200 Z" fill="url(#ogLogoGrad)"/>
      <path d="M 98 136 L 164 62 L 188 62 L 120 136 Z" fill="url(#ogLogoGrad)"/>
      <path d="M 108 124 L 178 200 L 154 200 L 94 136 Z" fill="url(#ogLogoGrad)"/>
      <circle cx="128" cy="128" r="16" fill="#00F5D4"/>
      <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 底部链接与版权 -->
  <text x="80" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748B">github.com/Agions/kineo</text>
  <text x="1200" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">© 2026 Kineo Team</text>
</svg>