[package]
name = "kineo-ipc"
version = "0.0.1"
edition = "2021"
description = "Kineo Tauri Command 强类型 IPC 桥接层"

[dependencies]
kineo-core = { path = "../core" }
kineo-ai = { path = "../ai" }
kineo-media = { path = "../media" }
kineo-plugin = { path = "../plugin" }
kineo-updater = { path = "../updater" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
