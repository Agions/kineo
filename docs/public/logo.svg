<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Kineo">
  <title>Kineo</title>
  <desc>Kineo · 端到端 Multi-Agent 漫剧创作平台视觉标识 (κῑνέω · 赋予动态与视听生命)</desc>
  <defs>
    <linearGradient id="kineoBrandPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="kineoAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="kineoBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121630"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="kineoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 底板 (冰川深空黑 + 晶体圆角) -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#kineoBg)" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- 顶部玻璃高光弧 -->
  <path d="M 42 18 Q 128 10 214 18" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2" fill="none"/>

  <!-- 背景网络：多智能体神经连结与分镜导轨 -->
  <g opacity="0.4">
    <line x1="40" y1="40" x2="96" y2="96" stroke="url(#kineoBrandPrimary)" stroke-width="1.2"/>
    <line x1="216" y1="40" x2="160" y2="96" stroke="url(#kineoBrandPrimary)" stroke-width="1.2"/>
    <line x1="40" y1="216" x2="96" y2="160" stroke="url(#kineoBrandPrimary)" stroke-width="1.2"/>
    <line x1="216" y1="216" x2="160" y2="160" stroke="url(#kineoBrandPrimary)" stroke-width="1.2"/>
    <circle cx="40" cy="40" r="2.5" fill="#00F5D4"/>
    <circle cx="216" cy="40" r="2.5" fill="#EC4899"/>
    <circle cx="40" cy="216" r="2.5" fill="#7C3AED"/>
    <circle cx="216" cy="216" r="2.5" fill="#00F5D4"/>
  </g>

  <!-- 漫剧 3 栏画幅胶片大盘 (三立柱构形) -->
  <g opacity="0.85">
    <rect x="44" y="68" width="36" height="120" rx="8" fill="none" stroke="url(#kineoAccent)" stroke-width="2.5" opacity="0.5"/>
    <rect x="176" y="68" width="36" height="120" rx="8" fill="none" stroke="url(#kineoAccent)" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- 中心核心超级符号：动势 'K' 标志 (融合胶片孔与镜头运镜轨迹) -->
  <g filter="url(#glowFilter)">
    <!-- K的主竖干 (胶片与时间轴象征) -->
    <path d="M 82 56 L 102 56 L 102 200 L 82 200 Z" fill="url(#kineoBrandPrimary)" rx="5"/>
    <!-- K的上斜臂 (向上推进运镜矢量) -->
    <path d="M 96 136 L 160 62 L 184 62 L 118 136 Z" fill="url(#kineoBrandPrimary)"/>
    <!-- K的下斜臂 (向下展开故事大盘) -->
    <path d="M 106 124 L 174 200 L 150 200 L 92 136 Z" fill="url(#kineoBrandPrimary)"/>
  </g>

  <!-- 中心动力光核 (象征 κῑνέω 动力引擎) -->
  <g transform="translate(128 128)">
    <circle r="32" fill="url(#kineoGlow)" opacity="0.6"/>
    <circle r="10" fill="#00F5D4" opacity="0.9"/>
    <circle r="4" fill="#FFFFFF"/>
    <!-- 镜头刻度十字线 -->
    <path d="M -22 0 L -12 0 M 12 0 L 22 0 M 0 -22 L 0 -12 M 0 12 L 0 22" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>