<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="Kineo · AI Manju Studio">
  <title>Kineo</title>
  <desc>Kineo 水平品牌 Logo: 标志 + 渐变文字 + 副标</desc>
  <defs>
    <linearGradient id="kineoHText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="kineoHLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="kineoHLogoBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151B38"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
  </defs>

  <!-- 左侧标志 -->
  <g transform="translate(24 20)">
    <rect width="160" height="160" rx="38" fill="url(#kineoHLogoBg)" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(8 8) scale(0.56)">
      <path d="M 82 56 L 104 56 L 104 200 L 82 200 Z" fill="url(#kineoHLogo)"/>
      <path d="M 98 136 L 164 62 L 188 62 L 120 136 Z" fill="url(#kineoHLogo)"/>
      <path d="M 108 124 L 178 200 L 154 200 L 94 136 Z" fill="url(#kineoHLogo)"/>
      <circle cx="128" cy="128" r="12" fill="#00F5D4"/>
      <circle cx="128" cy="128" r="5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 右侧中英文品牌名称 -->
  <g transform="translate(216 0)">
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5" fill="url(#kineoHText)">
      KINEO
    </text>
    <text x="2" y="136" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#E2E8F0">
      AI 漫剧创作平台 · Multi-Agent Studio
    </text>
    <text x="2" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#64748B">
      NOVEL · TO · 4K COMIC DRAMA · TAURI 2 + RUST
    </text>
  </g>
</svg>